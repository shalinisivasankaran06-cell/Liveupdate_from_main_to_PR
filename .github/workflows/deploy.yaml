name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and restart container
        run: |
          docker build -t appsampleimage .
          docker rm -f appsamplecontainer || true
          docker run -d --name mysamplecontainer -p 9000:5000 appsampleimage
