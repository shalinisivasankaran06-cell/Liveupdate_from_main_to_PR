name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/appimage:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/appimage:latest

      - name: Pull and restart container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/appimage:latest
          docker rm -f mysamplecontainer || true
          docker run -d --name mysamplecontainer -p 9000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/appimage:latest
